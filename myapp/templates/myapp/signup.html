{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga | Signup</title>
    <link rel="stylesheet" href="{% static 'myapp/auth.css' %}">
    <link rel="icon" type="image/png" href="{% static 'myapp/liga.png' %}">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/bs-brain@2.0.4/components/logins/login-12/assets/css/login-12.css">
</head>
<body>
<div class="position-fixed top-0 end-0 m-4" style="z-index: 1050;">
    <a href="{% url 'homepage' %}" class="btn btn-outline-light btn-lg d-flex align-items-center gap-2 shadow">
        <i class="fas fa-home"></i> Home
    </a>
</div>
    {% if messages %}
  <section class="py-4 bg-success text-white text-center" style="background: linear-gradient(135deg, #28a745, #1e7e34);">
    <div class="container">
      {% for message in messages %}
        <h4 class="mb-0"><i class="fas fa-check-circle me-2"></i> {{ message }}</h4>
      {% endfor %}
    </div>
  </section>
{% endif %}
    <section class="py-3 py-md-5 py-xl-8">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="mb-5">
                        <h2 class="display-5 fw-bold text-center">Sign up</h2>
                        <p class="text-center m-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
                    </div>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-6">
                    <form id="signup-form" method="post">
                        {% csrf_token %}
                        <div class="row gy-3 overflow-hidden">
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control border-0 border-bottom rounded-0" 
                                           name="username" id="username" placeholder="Username" required>
                                    <label for="username" class="form-label">Username</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control border-0 border-bottom rounded-0" 
                                           name="email" id="email" placeholder="name@example.com" required>
                                    <label for="email" class="form-label">Email</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control border-0 border-bottom rounded-0" 
                                           name="password" id="password" placeholder="Password" required>
                                    <label for="password" class="form-label">Password</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control border-0 border-bottom rounded-0" 
                                           name="confirm_password" id="confirm_password" 
                                           placeholder="Confirm Password" required>
                                    <label for="confirm_password" class="form-label">Confirm Password</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="d-grid">
                                    <button class="btn btn-lg btn-dark rounded-0 fs-6" type="submit">
                                        Sign up
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- <script src="{% static 'myapp/auth.js' %}"></script> -->
</body>
</html>
