{% extends "jazzmin/layout.html" %}

{% block user_links %}
    {% if user.is_authenticated %}
        <!-- User dropdown (keep this for future fix) -->
        <li class="nav-item dropdown me-2">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-user-circle fa-lg"></i>
                <span class="ms-1">{{ user.get_username|default:user.username }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                {% if user.is_staff %}
                    <li>
                        <a class="dropdown-item" href="{% url 'admin:password_change' %}">
                            <i class="fas fa-key me-2"></i> Change password
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                {% endif %}
                <li>
                    <form action="{% url 'admin:logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="fas fa-sign-out-alt me-2"></i> Log out
                        </button>
                    </form>
                </li>
            </ul>
        </li>

        <!-- Visible Logout button in top bar (always shown) -->
        <li class="nav-item">
            <form action="{% url 'admin:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="nav-link btn btn-sm btn-outline-danger">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </form>
        </li>
    {% endif %}
{% endblock %}
